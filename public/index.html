<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🔗 URL Shortener</h1>
      <p>Create short, shareable links instantly</p>
    </header>

    <main>
      <!-- Shorten Section -->
      <section class="shorten-section">
        <div class="form-group">
          <label for="urlInput">Original URL</label>
          <input
            type="text"
            id="urlInput"
            placeholder="https://example.com/very/long/url"
            autocomplete="off"
          />
        </div>

        <div class="form-group">
          <label for="aliasInput">Custom Alias (optional)</label>
          <input
            type="text"
            id="aliasInput"
            placeholder="my-link"
            autocomplete="off"
          />
        </div>

        <button id="shortenBtn" class="btn btn-primary">Shorten URL</button>

        <div id="errorMsg" class="error-message"></div>
      </section>

      <!-- Result Section -->
      <section id="resultSection" class="result-section hidden">
        <div class="result-card">
          <h3>Your shortened link is ready!</h3>
          <div class="result-item">
            <label>Short URL</label>
            <div class="result-url">
              <input
                type="text"
                id="resultShortUrl"
                readonly
                class="url-input"
              />
              <button id="copyBtn" class="btn btn-secondary">Copy</button>
            </div>
          </div>
          <div class="result-item">
            <label>Original URL</label>
            <input
              type="text"
              id="resultOriginalUrl"
              readonly
              class="url-input"
            />
          </div>
          <div class="result-item">
            <label>Created</label>
            <input
              type="text"
              id="resultCreatedAt"
              readonly
              class="url-input"
            />
          </div>
        </div>
      </section>

      <!-- Stats Section -->
      <section id="statsSection" class="stats-section hidden">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Total Links</div>
            <div class="stat-value" id="totalLinks">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Clicks</div>
            <div class="stat-value" id="totalClicks">0</div>
          </div>
        </div>
      </section>

      <!-- Links Table Section -->
      <section id="linksSection" class="links-section hidden">
        <h2>All Shortened Links</h2>
        <div class="table-wrapper">
          <table class="links-table">
            <thead>
              <tr>
                <th>Short Code</th>
                <th>Original URL</th>
                <th>Clicks</th>
                <th>Created</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="linksTableBody">
              <!-- Populated by JavaScript -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
